name: Build baseline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: baseline-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.5'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Analyze, test, and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Prepare pinned Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Use the runner's existing license state; reject any new prompt.
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" < <(printf 'n\n')
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce the sole production release path
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            case "$(basename "$workflow")" in
              debug.yml|signed-release.yml) continue ;;
            esac
            workflow_text="$(tr '\n' ' ' < "$workflow")"
            if grep -Eq -- '--flavor([=[:space:]\\]+)github([[:space:]\\]|$)' <<<"$workflow_text" &&
              { grep -Fq -- 'KEYSTORE2' <<<"$workflow_text" ||
                { grep -Fq -- 'flutter build apk' <<<"$workflow_text" &&
                  grep -Fq -- '--release' <<<"$workflow_text"; }; }; then
              echo "Legacy production-package build path found in $workflow"
              exit 1
            fi
          done

      - name: Verify bounded strict platform DEFLATE helper
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-strict-deflate-host"
          mkdir -p "$output"
          javac --release 8 -d "$output" android/app/src/main/java/com/gokadzev/musify/StrictDeflate.java tool/StrictDeflateHostTest.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output" com.gokadzev.musify.StrictDeflateHostTest

      - name: Verify incoming-file policy and bounded reader
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-incoming-host"
          mkdir -p "$output"
          javac --release 8 -d "$output" packages/receive_sharing_intent/android/src/main/java/com/kasem/receive_sharing_intent/ImportFileIntentPolicy.java android/app/src/main/java/com/gokadzev/musify/IncomingFileReader.java tool/IncomingFileHostTest.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output" com.gokadzev.musify.IncomingFileHostTest

      - name: Verify production incoming-channel ownership contract
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-incoming-channel-host"
          mkdir -p "$output/current" "$output/control"
          mapfile -t doubles < <(find tool/incoming-channel-host -name '*.java' -print)
          common=(packages/receive_sharing_intent/android/src/main/java/com/kasem/receive_sharing_intent/ImportFileIntentPolicy.java android/app/src/main/java/com/gokadzev/musify/IncomingFileReader.java)
          javac --release 8 -d "$output/current" "${doubles[@]}" "${common[@]}" android/app/src/main/java/com/gokadzev/musify/IncomingFileChannel.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output/current" com.gokadzev.musify.IncomingFileChannelHostTest
          git fetch --no-tags --depth=1 origin a24730c00e8b0dd3c12a7aa39a5cc42834739c32
          git show a24730c00e8b0dd3c12a7aa39a5cc42834739c32:android/app/src/main/java/com/gokadzev/musify/IncomingFileChannel.java > "$output/IncomingFileChannel.java"
          javac --release 8 -d "$output/control" "${doubles[@]}" "${common[@]}" "$output/IncomingFileChannel.java"
          if java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output/control" com.gokadzev.musify.IncomingFileChannelHostTest > "$output/control-result.txt" 2>&1; then
            echo "Defective channel unexpectedly passed the cancellation contract"
            exit 1
          fi
          grep -Fq 'Finished pending request A must not resurrect after BUSY' "$output/control-result.txt"
          echo "Exact a24730c channel control reproduced pending-request resurrection."
      - name: Reproduce authoritative-exclusion defect on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-exclusion-control-8ff4297f"
          git fetch --no-tags --depth=1 origin 8ff4297fbe80b29c073a0c362253f996c6256d02
          git worktree add --detach "$control" 8ff4297fbe80b29c073a0c362253f996c6256d02
          cp test/services/spotify_exclusion_routing_contract_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded test/services/spotify_exclusion_routing_contract_test.dart > "$original/whole-exclusion-control.log" 2>&1; then
            echo "Prior source unexpectedly honored the partial exclusion checkpoint"
            exit 1
          fi
          grep -Fq 'Authoritative permanent exclusion must not be routed' "$original/whole-exclusion-control.log"
          grep -Fq 'Expected:' "$original/whole-exclusion-control.log"
          echo "Exact8ff4297f control reproduced authoritative-exclusion omission."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source exclusion control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-exclusion-control-${{ github.run_number }}
          path: whole-exclusion-control.log
          if-no-files-found: error
      - name: Reproduce total and deleted-collection defects on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-completeness-control-ce6bf615"
          git fetch --no-tags --depth=1 origin ce6bf615e13caccd6726c56ac19379661c1e6cbd
          git worktree add --detach "$control" ce6bf615e13caccd6726c56ac19379661c1e6cbd
          cp test/services/spotify_source_completeness_contract_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded test/services/spotify_source_completeness_contract_test.dart > "$original/whole-completeness-control.log" 2>&1; then
            echo "Prior source unexpectedly protected totals and deleted collections"
            exit 1
          fi
          grep -Fq 'Inconsistent declared total must not certify whole source' "$original/whole-completeness-control.log"
          grep -Fq 'Deleted stored likes must never resurrect from stale cache' "$original/whole-completeness-control.log"
          grep -Fq 'Deleted playlist collections must never resurrect from stale cache' "$original/whole-completeness-control.log"
          echo "Exactce6bf615 control reproduced declared-total and deleted-collection defects."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source completeness control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-completeness-control-${{ github.run_number }}
          path: whole-completeness-control.log
          if-no-files-found: error
      - name: Reproduce mutable staged-value rollback defects on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-empty-staging-control-3a6eb762"
          git fetch --no-tags --depth=1 origin 3a6eb7622f53e904de5873858a56e773bc096294
          git worktree add --detach "$control" 3a6eb7622f53e904de5873858a56e773bc096294
          cp test/services/spotify_empty_source_playlist_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded --name 'mutable staged' test/services/spotify_empty_source_playlist_test.dart > "$original/empty-staging-control.log" 2>&1; then
            echo "Prior source unexpectedly preserved mutated staged values"
            exit 1
          fi
          grep -Fq 'Owner metadata mutation must survive staged rollback' "$original/empty-staging-control.log"
          grep -Fq 'Owner destination mutation must survive staged rollback' "$original/empty-staging-control.log"
          echo "Exact3a6eb762 control reproduced both mutable staged-value rollback defects."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source mutable staging control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-staging-control-${{ github.run_number }}
          path: empty-staging-control.log
          if-no-files-found: error
      - name: Reproduce committed empty-source reporting defect on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-empty-reporting-control-050f00e7"
          git fetch --no-tags --depth=1 origin 050f00e72f3f812a236c589a926799c6a2180954
          git worktree add --detach "$control" 050f00e72f3f812a236c589a926799c6a2180954
          cp test/services/spotify_empty_source_playlist_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded --name 'committed-source change' test/services/spotify_empty_source_playlist_test.dart > "$original/empty-reporting-control.log" 2>&1; then
            echo "Prior source unexpectedly reported committed/unverified creation truthfully"
            exit 1
          fi
          grep -Fq 'Committed destination must return saved/unverified feedback, not unchanged failure' "$original/empty-reporting-control.log"
          grep -Fq 'no playlist was changed' "$original/empty-reporting-control.log"
          echo "Exact050f00e7 control reproduced incorrect unchanged feedback after a committed destination write."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source committed reporting control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-reporting-control-${{ github.run_number }}
          path: empty-reporting-control.log
          if-no-files-found: error
      - name: Verify bounded logger cleanup and exact prior-source resistant-writer control
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          python3 -m py_compile tool/windows_owned_job.py tool/owned_command.py
          python3 -m unittest discover -s "$original/tool" -p '*command*test.py' -v
          control="$RUNNER_TEMP/musify-logger-cleanup-control-1192aa56"
          git fetch --no-tags --depth=1 origin 1192aa56bfb428499d236f665922e93f9015206e
          git worktree add --detach "$control" 1192aa56bfb428499d236f665922e93f9015206e
          cp tool/bounded_command_log_test.py "$control/tool/"
          cd "$control/tool"
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/logger-cleanup-control.log" --timeout-seconds 120 -- python3 -m unittest bounded_command_log_test.BoundedCommandLogTest.test_term_resistant_writer_timeout_is_124_and_leaves_no_writer
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'TimeoutExpired' "$original/logger-cleanup-control.log"
          grep -Fq 'test_term_resistant_writer_timeout_is_124_and_leaves_no_writer' "$original/logger-cleanup-control.log"
          echo "Exact1192aa56 control reproduced TERM-resistant writer cleanup failure; fixture cleanup retained."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source logger cleanup control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logger-cleanup-control-${{ github.run_number }}
          path: logger-cleanup-control.log
          if-no-files-found: error
      - name: Reproduce oversized occurrence proposal on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-occurrence-capacity-control-6a8d18fc"
          git fetch --no-tags --depth=1 origin 6a8d18fc3c5f44e0ede564c5f44e63a5863da18d
          git worktree add --detach "$control" 6a8d18fc3c5f44e0ede564c5f44e63a5863da18d
          cp test/services/spotify_source_occurrence_plan_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/occurrence-capacity-control.log" -- flutter test --no-pub -j 1 --reporter expanded --name 'proposed output above capacity' test/services/spotify_source_occurrence_plan_test.dart
          result=$?
          set -e
          test "$result" -eq 1
          test "$(wc -c < "$original/occurrence-capacity-control.log")" -lt 10485760
          grep -Fq 'Destination plus appends must fit the 10000-entry restart bound' "$original/occurrence-capacity-control.log"
          echo "Exact6a8d18fc control reproduced the 10001-entry occurrence proposal."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source occurrence capacity control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: occurrence-capacity-control-${{ github.run_number }}
          path: occurrence-capacity-control.log
          if-no-files-found: error
      - name: Reproduce stale review exclusion on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-stale-exclusion-control-2ef03a12"
          git fetch --no-tags --depth=1 origin 2ef03a12cbd48cc4aef922efc66f4ff30762d490
          git worktree add --detach "$control" 2ef03a12cbd48cc4aef922efc66f4ff30762d490
          cp test/services/spotify_stale_exclusion_resolution_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/stale-review-exclusion-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/services/spotify_stale_exclusion_resolution_test.dart --plain-name 'stale review cannot reactivate excluded row: accept=false'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'Expected: throws' "$original/stale-review-exclusion-control.log"
          grep -Fq 'SpotifyResolutionResult' "$original/stale-review-exclusion-control.log"
          grep -Fq 'stale review cannot reactivate excluded row: accept=false' "$original/stale-review-exclusion-control.log"
          echo "Exact2ef03a12 control reproduced stale review reactivation of a permanent exclusion."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source stale exclusion control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stale-review-exclusion-control-${{ github.run_number }}
          path: stale-review-exclusion-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce rescue overwrite of a newer manual owner on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-rescue-owner-control-e2ebb0b8"
          git fetch --no-tags --depth=1 origin e2ebb0b82a0ef88a42b9ded2220ed886bed559e4
          git worktree add --detach "$control" e2ebb0b82a0ef88a42b9ded2220ed886bed559e4
          cp test/services/spotify_rescue_owner_preservation_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/rescue-owner-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/services/spotify_rescue_owner_preservation_test.dart --plain-name 'rescue cannot overwrite a newer real manual decision beside excluded row'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq "Expected: 'owned-newer-manual'" "$original/rescue-owner-control.log"
          grep -Fq 'Actual: <null>' "$original/rescue-owner-control.log"
          echo "Exacte2ebb0b8 control reproduced rescue replacing the newer real manual decision."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source rescue owner control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rescue-owner-control-${{ github.run_number }}
          path: rescue-owner-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce late manual preview ownership defect on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-manual-preview-control-4104ccee"
          git fetch --no-tags --depth=1 origin 4104ccee8cf150e66026934629ee6ee22fe586a0
          git worktree add --detach "$control" 4104ccee8cf150e66026934629ee6ee22fe586a0
          git fetch --no-tags --depth=1 origin 84c488c930ca04bb391bc39d713f0cc43de4e818
          git show 84c488c930ca04bb391bc39d713f0cc43de4e818:test/screens/spotify_manual_preview_ownership_test.dart > "$control/test/screens/spotify_manual_preview_ownership_test.dart"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/manual-preview-owner-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/screens/spotify_manual_preview_ownership_test.dart --plain-name 'late manual preview resolver cannot replace or stop B: failure=false'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'STALE_MANUAL_RESOLVER_LOADED_AFTER_B' "$original/manual-preview-owner-control.log"
          grep -Fq 'url-a' "$original/manual-preview-owner-control.log"
          grep -Fq 'url-b' "$original/manual-preview-owner-control.log"
          echo "Exact4104ccee control reproduced late A loading after the newer B preview."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source manual preview owner control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-preview-owner-control-${{ github.run_number }}
          path: manual-preview-owner-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce blocked manual preview recovery on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-manual-retirement-control-4aa4b161"
          git fetch --no-tags --depth=1 origin 4aa4b161fea7538f5b457a44adfd5e90f7d53dc6
          git worktree add --detach "$control" 4aa4b161fea7538f5b457a44adfd5e90f7d53dc6
          cp test/screens/spotify_manual_preview_retirement_test.dart "$control/test/screens/"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/manual-preview-retirement-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/screens/spotify_manual_preview_retirement_test.dart --plain-name 'hung load retires before B and ignores late failure=false'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'HUNG_MANUAL_PREVIEW_BLOCKED_SUCCESSOR' "$original/manual-preview-retirement-control.log"
          grep -Fq 'Actual: []' "$original/manual-preview-retirement-control.log"
          echo "Exact4aa4b161 control reproduced B blocked behind the unsettled native A load."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source manual retirement control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-preview-retirement-control-${{ github.run_number }}
          path: manual-preview-retirement-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce rejected folder move membership loss on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-folder-move-control-84c488c9"
          git fetch --no-tags --depth=1 origin 84c488c930ca04bb391bc39d713f0cc43de4e818
          git worktree add --detach "$control" 84c488c930ca04bb391bc39d713f0cc43de4e818
          cp test/services/playlist_folder_move_preservation_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/folder-move-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/services/playlist_folder_move_preservation_test.dart --plain-name 'rejected folder move preserves membership and stored bytes: missing'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'REJECTED_FOLDER_MOVE_CHANGED_MEMBERSHIP' "$original/folder-move-control.log"
          grep -Fq 'Expected:' "$original/folder-move-control.log"
          echo "Exact84c488c9 control reproduced live membership mutation after a rejected move."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source folder move control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folder-move-control-${{ github.run_number }}
          path: folder-move-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce stale folder source ownership on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-folder-source-control-2dbe545c"
          git fetch --no-tags --depth=1 origin 2dbe545cda7b4f666d7c9ea56298e1986adde0b1
          git worktree add --detach "$control" 2dbe545cda7b4f666d7c9ea56298e1986adde0b1
          cp test/services/playlist_folder_move_preservation_test.dart "$control/test/services/playlist_folder_move_preservation_test.dart"
          cd "$control"
          flutter pub get --offline
          set +e
          python3 "$original/tool/bounded_command_log.py" --log "$original/folder-source-control.log" --timeout-seconds 180 -- flutter test --no-pub --reporter expanded -j 1 test/services/playlist_folder_move_preservation_test.dart --plain-name 'retained source move refuses newer or missing owner: changed-root'
          result=$?
          set -e
          test "$result" -eq 1
          grep -Fq 'STALE_SOURCE_MOVE_MUST_REFUSE' "$original/folder-source-control.log"
          grep -Fq 'Expected:' "$original/folder-source-control.log"
          echo "Exact2dbe545c control reproduced stale folder source ownership."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source folder-source-control
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folder-source-control-${{ github.run_number }}
          path: folder-source-control.log
          if-no-files-found: error
          retention-days: 7
      - name: Reproduce retained picker source overwrite on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-folder-picker-source-control-b006957f"
          git fetch --no-tags --depth=1 origin b006957f3417aa852a05532d11bf5694ba9ef52a
          git worktree add --detach "$control" b006957f3417aa852a05532d11bf5694ba9ef52a
          cp test/screens/playlist_folder_source_picker_test.dart "$control/test/screens/playlist_folder_source_picker_test.dart"
