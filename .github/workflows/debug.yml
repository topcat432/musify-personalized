name: Build baseline APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: baseline-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.5'
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: Analyze, test, and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Prepare pinned Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Use the runner's existing license state; reject any new prompt.
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" \
            "ndk;28.2.13676358" "cmake;3.22.1" < <(printf 'n\n')
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce the sole production release path
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for workflow in .github/workflows/*.yml .github/workflows/*.yaml; do
            case "$(basename "$workflow")" in
              debug.yml|signed-release.yml) continue ;;
            esac
            workflow_text="$(tr '\n' ' ' < "$workflow")"
            if grep -Eq -- '--flavor([=[:space:]\\]+)github([[:space:]\\]|$)' <<<"$workflow_text" &&
              { grep -Fq -- 'KEYSTORE2' <<<"$workflow_text" ||
                { grep -Fq -- 'flutter build apk' <<<"$workflow_text" &&
                  grep -Fq -- '--release' <<<"$workflow_text"; }; }; then
              echo "Legacy production-package build path found in $workflow"
              exit 1
            fi
          done

      - name: Verify bounded strict platform DEFLATE helper
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-strict-deflate-host"
          mkdir -p "$output"
          javac --release 8 -d "$output" android/app/src/main/java/com/gokadzev/musify/StrictDeflate.java tool/StrictDeflateHostTest.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output" com.gokadzev.musify.StrictDeflateHostTest

      - name: Verify incoming-file policy and bounded reader
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-incoming-host"
          mkdir -p "$output"
          javac --release 8 -d "$output" packages/receive_sharing_intent/android/src/main/java/com/kasem/receive_sharing_intent/ImportFileIntentPolicy.java android/app/src/main/java/com/gokadzev/musify/IncomingFileReader.java tool/IncomingFileHostTest.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output" com.gokadzev.musify.IncomingFileHostTest

      - name: Verify production incoming-channel ownership contract
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-incoming-channel-host"
          mkdir -p "$output/current" "$output/control"
          mapfile -t doubles < <(find tool/incoming-channel-host -name '*.java' -print)
          common=(packages/receive_sharing_intent/android/src/main/java/com/kasem/receive_sharing_intent/ImportFileIntentPolicy.java android/app/src/main/java/com/gokadzev/musify/IncomingFileReader.java)
          javac --release 8 -d "$output/current" "${doubles[@]}" "${common[@]}" android/app/src/main/java/com/gokadzev/musify/IncomingFileChannel.java
          java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output/current" com.gokadzev.musify.IncomingFileChannelHostTest
          git fetch --no-tags --depth=1 origin a24730c00e8b0dd3c12a7aa39a5cc42834739c32
          git show a24730c00e8b0dd3c12a7aa39a5cc42834739c32:android/app/src/main/java/com/gokadzev/musify/IncomingFileChannel.java > "$output/IncomingFileChannel.java"
          javac --release 8 -d "$output/control" "${doubles[@]}" "${common[@]}" "$output/IncomingFileChannel.java"
          if java -Xmx128m -XX:MaxMetaspaceSize=64m -cp "$output/control" com.gokadzev.musify.IncomingFileChannelHostTest > "$output/control-result.txt" 2>&1; then
            echo "Defective channel unexpectedly passed the cancellation contract"
            exit 1
          fi
          grep -Fq 'Finished pending request A must not resurrect after BUSY' "$output/control-result.txt"
          echo "Exact a24730c channel control reproduced pending-request resurrection."
      - name: Reproduce authoritative-exclusion defect on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-exclusion-control-8ff4297f"
          git fetch --no-tags --depth=1 origin 8ff4297fbe80b29c073a0c362253f996c6256d02
          git worktree add --detach "$control" 8ff4297fbe80b29c073a0c362253f996c6256d02
          cp test/services/spotify_exclusion_routing_contract_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded test/services/spotify_exclusion_routing_contract_test.dart > "$original/whole-exclusion-control.log" 2>&1; then
            echo "Prior source unexpectedly honored the partial exclusion checkpoint"
            exit 1
          fi
          grep -Fq 'Authoritative permanent exclusion must not be routed' "$original/whole-exclusion-control.log"
          grep -Fq 'Expected:' "$original/whole-exclusion-control.log"
          echo "Exact8ff4297f control reproduced authoritative-exclusion omission."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source exclusion control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-exclusion-control-${{ github.run_number }}
          path: whole-exclusion-control.log
          if-no-files-found: error
      - name: Reproduce total and deleted-collection defects on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-completeness-control-ce6bf615"
          git fetch --no-tags --depth=1 origin ce6bf615e13caccd6726c56ac19379661c1e6cbd
          git worktree add --detach "$control" ce6bf615e13caccd6726c56ac19379661c1e6cbd
          cp test/services/spotify_source_completeness_contract_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded test/services/spotify_source_completeness_contract_test.dart > "$original/whole-completeness-control.log" 2>&1; then
            echo "Prior source unexpectedly protected totals and deleted collections"
            exit 1
          fi
          grep -Fq 'Inconsistent declared total must not certify whole source' "$original/whole-completeness-control.log"
          grep -Fq 'Deleted stored likes must never resurrect from stale cache' "$original/whole-completeness-control.log"
          grep -Fq 'Deleted playlist collections must never resurrect from stale cache' "$original/whole-completeness-control.log"
          echo "Exactce6bf615 control reproduced declared-total and deleted-collection defects."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source completeness control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-completeness-control-${{ github.run_number }}
          path: whole-completeness-control.log
          if-no-files-found: error
      - name: Reproduce mutable staged-value rollback defects on exact prior source
        shell: bash
        run: |
          set -euo pipefail
          original="$GITHUB_WORKSPACE"
          control="$RUNNER_TEMP/musify-empty-staging-control-3a6eb762"
          git fetch --no-tags --depth=1 origin 3a6eb7622f53e904de5873858a56e773bc096294
          git worktree add --detach "$control" 3a6eb7622f53e904de5873858a56e773bc096294
          cp test/services/spotify_empty_source_playlist_test.dart "$control/test/services/"
          cd "$control"
          flutter pub get --offline
          if flutter test --no-pub -j 1 --reporter expanded --name 'mutable staged' test/services/spotify_empty_source_playlist_test.dart > "$original/empty-staging-control.log" 2>&1; then
            echo "Prior source unexpectedly preserved mutated staged values"
            exit 1
          fi
          grep -Fq 'Owner metadata mutation must survive staged rollback' "$original/empty-staging-control.log"
          grep -Fq 'Owner destination mutation must survive staged rollback' "$original/empty-staging-control.log"
          echo "Exact3a6eb762 control reproduced both mutable staged-value rollback defects."
          test "$(git -C "$original" rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Upload exact prior-source mutable staging control log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-staging-control-${{ github.run_number }}
          path: empty-staging-control.log
          if-no-files-found: error
      - name: Prepare read-only empty-source formatting suggestions
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/musify-empty-source-format"
          files=(
            lib/screens/spotify_import_page.dart
            lib/screens/spotify_source_playlists_page.dart
            lib/services/spotify_import_destination_service.dart
            lib/services/spotify_playlist_draft.dart
            lib/services/spotify_whole_source_readiness.dart
            test/services/spotify_empty_source_playlist_test.dart
            test/screens/spotify_empty_source_playlist_page_test.dart
            test/support/spotify_empty_source_fixture.dart
          )
          for file in "${files[@]}"; do
            mkdir -p "$output/$(dirname "$file")"
            cp "$file" "$output/$file"
          done
          dart format "$output/lib" "$output/test"
          test "$(du -sb "$output" | cut -f1)" -le 10485760
          git diff --exit-code

      - name: Upload read-only formatting suggestions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: empty-source-format-${{ github.run_number }}
          path: ${{ runner.temp }}/musify-empty-source-format/
          if-no-files-found: error
          retention-days: 7
      - name: Analyze Dart code
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub . 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload analyzer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-${{ github.run_number }}
          path: flutter-analyze.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on analyzer issues
        if: steps.analyze.outputs.status != '0'
        run: exit 1

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --no-pub 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-${{ github.run_number }}
          path: flutter-test.log
          if-no-files-found: error
          retention-days: 7

      - name: Fail on test failures
        if: steps.tests.outputs.status != '0'
        run: exit 1

      - name: Record reference visual environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-environment
          flutter --version > build/visual-environment/flutter-version.txt
          if [[ -f "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf" ]]; then
            visual_font="$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/Roboto-Regular.ttf"
          else
            visual_font=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          fi
          echo "$visual_font" > build/visual-environment/selected-font.txt
          sha256sum "$visual_font" | tee build/visual-environment/font-sha256.txt
          cp "$visual_font" build/visual-environment/visualSans.ttf
          find "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts" -maxdepth 1 -iname '*license*' -exec cp {} build/visual-environment/ \;

      - name: Upload reference visual environment
        uses: actions/upload-artifact@v4
        with:
          name: visual-environment-${{ github.run_number }}
          path: build/visual-environment/
          if-no-files-found: error
          retention-days: 14

      - name: Run personalized visual review suite
        id: visual_review_personalized
        shell: bash
        run: |
          set +e
          flutter test --no-pub tool/visual_review_test.dart 2>&1 | tee flutter-visual-review-personalized.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload personalized visual review log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-personalized-log-${{ github.run_number }}
          path: flutter-visual-review-personalized.log
          if-no-files-found: error
          retention-days: 7

      - name: Run priority visual review suite
        id: visual_review_priority
        shell: bash
        run: |
          set +e
          flutter test --no-pub tool/visual_review_priority_test.dart 2>&1 | tee flutter-visual-review-priority.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload priority visual review log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-priority-log-${{ github.run_number }}
          path: flutter-visual-review-priority.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload visual review screenshots and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-${{ github.run_number }}
          path: |
            tool/visual_review_goldens/*.png
            tool/failures/**
          if-no-files-found: warn
          retention-days: 14

      - name: Fail on visual review mismatches
        if: steps.visual_review_personalized.outputs.status != '0' || steps.visual_review_priority.outputs.status != '0'
        run: exit 1

      - name: Build universal debug APK
        run: >-
          flutter build apk --no-pub --debug --flavor github
          --dart-define=GIT_SHA=${{ env.SOURCE_SHA }}

      - name: Verify debug APK output
        run: test -f build/app/outputs/flutter-apk/app-github-debug.apk

      - name: Verify debug channel identity
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-github-debug.apk
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          badging="$($aapt dump badging "$apk")"
          permissions="$($aapt dump permissions "$apk")"
          grep -Fq "package: name='com.topcat432.musifypersonalized.preview.debug'" <<<"$badging"
          grep -Fq "application-label:'Musify Personalized DEBUG'" <<<"$badging"
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"$permissions"
          ! cmp -s \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            android/app/src/debug/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build and verify F-Droid permission boundary
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --no-pub --debug --flavor fdroid -t lib/main_fdroid.dart
          apk=build/app/outputs/flutter-apk/app-fdroid-debug.apk
          test -f "$apk"
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          badging="$($aapt dump badging "$apk")"
          permissions="$($aapt dump permissions "$apk")"
          grep -Fq "package: name='com.gokadzev.musify.fdroid.debug'" <<<"$badging"
          ! grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' <<<"$permissions"

      - name: Build unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          build_number=$((300000001 + GITHUB_RUN_NUMBER))
          flutter build apk --no-pub \
            --release \
            --flavor github \
            --build-number "$build_number" \
            --build-name "0.1.$build_number" \
            --dart-define=GIT_SHA="$SOURCE_SHA"

      - name: Verify unsigned release APK output
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-github-release.apk
          test -f "$apk"
          test ! -e android/key.properties
          test ! -e android/app/key.jks
          unzip -t "$apk" >/dev/null
          build_number=$((300000001 + GITHUB_RUN_NUMBER))
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          if "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Verification APK must remain unsigned."
            exit 1
          fi
          aapt="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          badging="$($aapt dump badging "$apk")"
          grep -Fq "package: name='com.topcat432.musifypersonalized.preview'" <<<"$badging"
          grep -Fq "versionCode='$build_number'" <<<"$badging"
          grep -Fq "versionName='0.1.$build_number'" <<<"$badging"
          grep -Fq "application-label:'Musify Personalized'" <<<"$badging"
          ! grep -Fq 'application-debuggable' <<<"$badging"

      # CI builds are verification inputs only. They are deliberately not
      # uploaded because debug signing is ephemeral and unsigned releases are
      # not safe user updates. User-facing APKs come only from signed-release.
